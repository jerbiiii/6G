apiVersion: v1
kind: Namespace
metadata:
  name: at10-edge-fog-cloud
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: echo-service-script
  namespace: at10-edge-fog-cloud
data:
  server.py: |
    import http.server
    import socketserver
    import json
    import time
    import os

    TIER = os.environ.get("SERVICE_TIER", "UNKNOWN")
    NODE = os.environ.get("MY_NODE_NAME", "UNKNOWN")

    class Handler(http.server.SimpleHTTPRequestHandler):
        def do_GET(self):
            start = time.time()
            if self.path == "/health":
                self.send_response(200)
                self.send_header('Content-type', 'application/json')
                self.end_headers()
                resp = {"status": "OK", "tier": TIER, "node": NODE}
                self.wfile.write(json.dumps(resp).encode())
            elif self.path.startswith("/compute"):
                # Simulation d'une tâche de calcul légère 6G
                val = sum(i*i for i in range(10000))
                elapsed_ms = (time.time() - start) * 1000
                self.send_response(200)
                self.send_header('Content-type', 'application/json')
                self.end_headers()
                resp = {"status": "SUCCESS", "tier": TIER, "node": NODE, "compute_result": val, "processing_time_ms": round(elapsed_ms, 3)}
                self.wfile.write(json.dumps(resp).encode())
            else:
                self.send_response(200)
                self.send_header('Content-type', 'text/plain')
                self.end_headers()
                self.wfile.write(f"6G Tier {TIER} on node {NODE} Ready\n".encode())

    PORT = 8080
    with socketserver.TCPServer(("", PORT), Handler) as httpd:
        print(f"Starting {TIER} server on port {PORT}")
        httpd.serve_forever()
---
# 1. Edge Service sur vm-ran (NodePort 30081)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: edge-service
  namespace: at10-edge-fog-cloud
spec:
  replicas: 1
  selector:
    matchLabels:
      app: edge-service
  template:
    metadata:
      labels:
        app: edge-service
    spec:
      nodeSelector:
        kubernetes.io/hostname: vm-ran
      containers:
      - name: python-echo
        image: python:3.11-alpine
        command: ["python3", "/app/server.py"]
        env:
        - name: SERVICE_TIER
          value: "EDGE"
        - name: MY_NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        resources:
          requests:
            cpu: 20m
            memory: 32Mi
          limits:
            cpu: 200m
            memory: 128Mi
        ports:
        - containerPort: 8080
        volumeMounts:
        - name: code
          mountPath: /app
      volumes:
      - name: code
        configMap:
          name: echo-service-script
---
apiVersion: v1
kind: Service
metadata:
  name: edge-service
  namespace: at10-edge-fog-cloud
spec:
  type: NodePort
  selector:
    app: edge-service
  ports:
  - port: 8080
    targetPort: 8080
    nodePort: 30081
---
